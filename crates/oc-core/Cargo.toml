[package]
name = "oc-core"
description = "OpenChat protocol core: identity, X3DH, sealed sender, frames, mailboxes, ratchet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.12"
hmac = "0.12"
ml-kem = { version = "0.3", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
