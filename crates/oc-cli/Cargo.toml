[package]
name = "oc-cli"
description = "OpenChat command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "oc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
oc-client = { path = "../oc-client" }
oc-transport = { path = "../oc-transport" }
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "io-std", "time"] }
zeroize = "1"
