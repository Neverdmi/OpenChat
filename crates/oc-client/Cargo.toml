[package]
name = "oc-client"
description = "OpenChat client: encrypted state, invites, sessions and message flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.22"
data-encoding = "2"
futures-util = "0.3"
hex = "0.4"
oc-core = { path = "../oc-core" }
oc-transport = { path = "../oc-transport" }
oc-wire = { path = "../oc-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
oc-relay = { path = "../oc-relay" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
