[workspace]
resolver = "3"
members = [
    "crates/oc-core",
    "crates/oc-wire",
    "crates/oc-transport",
    "crates/oc-relay",
    "crates/oc-client",
    "crates/oc-cli",
    # Terminal UI, likewise built on demand (`cargo build -p oc-tui`).
    "crates/oc-tui",
]
default-members = [
    "crates/oc-core",
    "crates/oc-wire",
    "crates/oc-transport",
    "crates/oc-relay",
    "crates/oc-client",
    "crates/oc-cli",
]

[workspace.package]
version = "0.1.22"
edition = "2024"
rust-version = "1.87"
license = "BSD-3-Clause"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
